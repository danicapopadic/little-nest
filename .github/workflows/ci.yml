name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: little_nest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d little_nest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/little_nest_test
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/little_nest_test
        run: uv run pytest