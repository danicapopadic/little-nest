services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://little_nest:${POSTGRES_PASSWORD}@db:5432/little_nest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic/versions:/app/alembic/versions
    command: >
      uv run --no-sync uvicorn little_nest.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: little_nest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: little_nest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U little_nest -d little_nest"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: little_nest_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data: