services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://little_nest:${POSTGRES_PASSWORD}@db:5432/little_nest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./alembic/versions:/app/alembic/versions

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: little_nest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: little_nest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U little_nest -d little_nest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: