[project]
name = "little-nest"
version = "0.1.0"
description = "Household management application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
